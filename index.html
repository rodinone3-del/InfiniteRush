<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0d0906"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">

<title>Безкінечна арена</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one portrait arena stage centred on screen; HUD, toasts and menus are DOM layers over a canvas. Look: dark hand-inked fantasy, parchment UI, accent follows the arena. */
:root{
  --bg:#0d0906; --panel:#1f1610; --panel-2:#2c2017; --line:#4d3924; --ink:#1a120b;
  --fg:#f0e4c8; --muted:#b39e7e; --parch:#e3c88e;
  --accent:#ffc65c; --blood:#b8352b; --blood-hi:#ff5a3c;
  --font-display:'Ruslan Display',Georgia,'Times New Roman',serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:14px/1.4 var(--font-body);
  overflow:hidden; touch-action:none; overscroll-behavior:none;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
}
#app{position:fixed; inset:0; display:grid; place-items:center; padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#stage{position:relative; overflow:hidden; background:var(--bg)}
#cv{display:block; touch-action:none}
.hud{position:absolute; inset:0 0 auto 0; display:flex; gap:8px; align-items:center; padding:10px; pointer-events:none}
.wave{display:flex; flex-direction:column; min-width:64px; text-shadow:0 2px 0 #000, 0 0 6px #000}
.wave b{font:400 16px/1.1 var(--font-display); color:var(--accent)}
.wave span{font-size:11px; color:var(--fg); opacity:.85; font-variant-numeric:tabular-nums}
.hp{position:relative; flex:1; min-width:0; height:20px; background:#120c08; border:2px solid var(--ink); border-radius:7px 11px 8px 10px / 10px 7px 11px 8px; overflow:hidden; box-shadow:0 0 0 1px #3a2a1a}
.hp i{position:absolute; inset:0 auto 0 0; width:100%; background:linear-gradient(#d4493a,#a02b22); transition:width .15s}
.hp.low i{background:linear-gradient(#ff6a48,#d2331f)}
.hp span{position:relative; display:block; text-align:center; font:600 11px/16px var(--font-body); font-variant-numeric:tabular-nums; text-shadow:0 1px 1px #000}
.ibtn{pointer-events:auto; width:38px; height:38px; flex:none; display:grid; place-items:center; border-radius:50%; border:2px solid var(--ink); background:rgba(31,22,16,.92); color:var(--parch); padding:0; cursor:pointer; box-shadow:0 2px 0 #000}
.ibtn svg{width:18px; height:18px; fill:currentColor}
.ibtn:focus-visible,.btn:focus-visible,.card:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
#btnMute .slash{display:none}
#btnMute.off .slash{display:block}
.boss{position:absolute; left:12px; right:12px; top:58px; pointer-events:none}
.boss span{display:block; font:400 14px/1.2 var(--font-display); letter-spacing:.06em; margin-bottom:4px; text-shadow:0 2px 0 #000, 0 0 6px #000}
.boss .bar{height:10px; border-radius:5px; background:#120c08; border:2px solid var(--ink); overflow:hidden}
.boss i{display:block; height:100%; width:100%}
#toast{position:absolute; left:0; right:0; top:32%; text-align:center; pointer-events:none; padding:0 16px}
#toast b{display:block; font:400 32px/1.1 var(--font-display); color:var(--accent); text-shadow:0 3px 0 #000, 0 0 12px rgba(0,0,0,.8)}
#toast span{display:block; margin-top:6px; color:var(--fg); font-size:14px; text-shadow:0 1px 2px #000}
#hint{position:absolute; left:50%; bottom:16px; transform:translateX(-50%); width:max-content; max-width:calc(100% - 32px); padding:8px 14px; border-radius:999px; background:rgba(20,13,8,.9); border:2px solid var(--ink); color:var(--parch); font-size:13px; text-align:center; pointer-events:none}
#screen{position:absolute; inset:0; overflow-y:auto; padding:16px; background:rgba(10,7,4,.92); touch-action:pan-y; -webkit-overflow-scrolling:touch; -webkit-user-select:none; user-select:none}
.sheet{min-height:100%; width:100%; max-width:640px; margin:0 auto; display:flex; flex-direction:column; justify-content:center; gap:10px}
#screen h2{margin:0; font:400 30px/1.1 var(--font-display); color:var(--accent); text-shadow:0 3px 0 #000}
#screen p{margin:0 0 6px; color:var(--muted)}
#screen p.rec{color:var(--accent); font-weight:600}
.card{display:grid; gap:2px; width:100%; min-height:64px; text-align:left; padding:12px 14px; border-radius:7px 11px 8px 10px / 10px 7px 11px 8px; border:2px solid var(--ink); background:var(--panel); color:var(--fg); font:inherit; cursor:pointer; box-shadow:0 3px 0 #000, inset 0 0 0 1px var(--line)}
.card:active{transform:translateY(2px); box-shadow:0 1px 0 #000, inset 0 0 0 1px var(--line); background:var(--panel-2)}
.card strong{font:400 17px/1.2 var(--font-display); color:var(--accent); letter-spacing:.02em}
.card span{color:var(--muted); font-size:13px}
.btn{width:100%; min-height:48px; padding:12px 14px; border-radius:7px 11px 8px 10px / 10px 7px 11px 8px; border:2px solid var(--ink); background:var(--parch); color:var(--ink); font:400 18px/1 var(--font-display); cursor:pointer; box-shadow:0 3px 0 #000}
.btn:active{transform:translateY(2px); box-shadow:0 1px 0 #000}
.btn.ghost{background:var(--panel); color:var(--fg); box-shadow:0 3px 0 #000, inset 0 0 0 1px var(--line)}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:4px 0 8px}
.stats div{background:var(--panel); border:2px solid var(--ink); border-radius:7px 11px 8px 10px / 10px 7px 11px 8px; padding:10px 8px; text-align:center; box-shadow:inset 0 0 0 1px var(--line)}
.stats b{display:block; font:400 26px/1.1 var(--font-display); color:var(--accent); font-variant-numeric:tabular-nums}
.stats span{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em}

.cards{display:grid; gap:10px}
.btnrow{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.btn.sm{min-height:44px; font-size:15px; padding:10px 8px}
.btn:disabled{opacity:.55}
.tabs{display:flex; gap:8px}
.tabs .btn{flex:1}
.tabs .btn.on{background:var(--parch); color:var(--ink)}
.tabs .btn:not(.on){background:var(--panel); color:var(--fg)}
.field{width:100%; min-height:46px; padding:10px 12px; border-radius:7px 11px 8px 10px / 10px 7px 11px 8px; border:2px solid var(--ink); background:#120c08; color:var(--fg); font:600 16px var(--font-body); box-shadow:inset 0 0 0 1px var(--line); -webkit-user-select:text; user-select:text}
.field:focus-visible{outline:2px solid var(--accent)}
.note{margin:0; font-size:12px; color:var(--muted)}
.lb{display:flex; flex-direction:column; gap:6px}
.row{border:2px solid var(--ink); border-radius:7px 11px 8px 10px / 10px 7px 11px 8px; background:var(--panel); box-shadow:inset 0 0 0 1px var(--line)}
.row > button{all:unset; box-sizing:border-box; display:grid; grid-template-columns:28px 1fr auto; gap:8px; align-items:center; width:100%; padding:10px; cursor:pointer; color:var(--fg); font:14px/1.3 var(--font-body)}
.row > button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.row .pos{font:400 16px var(--font-display); color:var(--accent); text-align:center}
.row .nm{min-width:0; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .sub{display:block; font-weight:400; font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis}
.row .sc{font:400 16px var(--font-display); color:var(--accent); text-align:right; font-variant-numeric:tabular-nums}
.detail{padding:0 10px 10px; display:grid; gap:8px; font-size:12px; color:var(--muted)}
.chips{display:flex; flex-wrap:wrap; gap:4px}
.chip{display:inline-block; padding:3px 8px; border-radius:999px; border:1px solid var(--ink); background:var(--panel-2); color:var(--fg); font-size:12px; font-weight:600; box-shadow:inset 3px 0 0 var(--c, var(--accent))}
.kv{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.kv div{display:flex; justify-content:space-between; gap:8px; padding:7px 10px; border-radius:7px; background:var(--panel); border:1px solid var(--ink); box-shadow:inset 0 0 0 1px var(--line)}
.kv span{color:var(--muted)}
.kv b{font-variant-numeric:tabular-nums; color:var(--fg); text-align:right}
#boosts{position:absolute; left:8px; right:8px; bottom:10px; display:flex; flex-wrap:wrap; gap:6px; justify-content:center; pointer-events:none}

.ibtn{position:relative}
.badge{position:absolute; top:-4px; right:-4px; min-width:18px; height:18px; padding:0 4px; border-radius:9px; background:var(--accent); color:var(--ink); font:700 11px/15px var(--font-body); text-align:center; border:1.5px solid var(--ink)}
#xpbar{position:absolute; left:0; right:0; top:0; height:5px; background:rgba(0,0,0,.5); pointer-events:none}
#xpbar i{display:block; height:100%; width:0; background:linear-gradient(90deg,#c9971f,#ffd84a)}
.cbody{display:grid; gap:8px}
.mtitle{font-size:38px!important; text-align:center; line-height:1.05!important}
.mname{margin:0; text-align:center; font-weight:600}
.sheet .center{text-align:center}
#cosStack{position:absolute; left:0; right:0; top:calc(env(safe-area-inset-top,0px) + 76px); display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; z-index:40; padding:0 16px}
.cosn{display:flex; gap:10px; align-items:center; background:rgba(22,15,10,.94); border:2px solid var(--c,#ffd84a); border-radius:12px; padding:9px 14px; box-shadow:0 4px 0 #000, 0 0 18px var(--c,#ffd84a); max-width:100%}
.cosn i{flex:none; width:12px; height:12px; border-radius:50%; background:var(--c,#ffd84a); box-shadow:0 0 8px var(--c,#ffd84a)}
.cosn b{display:block; font:400 16px/1.1 var(--font-display); color:var(--c,#ffd84a)}
.cosn span{display:block; margin-top:2px; font-size:12px; color:var(--fg)}
.sw{display:flex; flex-wrap:wrap; gap:9px}
.swb{width:34px; height:34px; border-radius:50%; border:2px solid var(--ink); cursor:pointer; padding:0; box-shadow:0 2px 0 #000}
.swb.on{outline:3px solid var(--parch); outline-offset:2px}
.swb:disabled{opacity:.28; cursor:default; background-image:repeating-linear-gradient(45deg,transparent 0 4px,rgba(0,0,0,.45) 4px 6px)}
.opt{padding:7px 12px; border-radius:999px; border:2px solid var(--ink); background:var(--panel); color:var(--fg); font:600 13px var(--font-body); cursor:pointer}
.opt.on{background:var(--parch); color:var(--ink)}
.opt:disabled{opacity:.35; cursor:default}
.lkprev{display:flex; justify-content:center}
.lkprev canvas{width:156px; height:176px; border-radius:10px; border:2px solid var(--ink); background:radial-gradient(circle at 50% 70%,#4a3a28,#171009)}
.tabs .btn.sm{padding-left:4px; padding-right:4px}
.sk{display:grid; grid-template-columns:1fr auto; gap:2px 10px; align-items:center; padding:8px 10px; border-radius:7px; background:var(--panel); border:1px solid var(--ink); box-shadow:inset 0 0 0 1px var(--line)}
.sk b{color:var(--fg); font-variant-numeric:tabular-nums}
.sk small{color:var(--muted); grid-column:1}
.sk .plus{grid-row:1 / span 2; grid-column:2; width:40px; height:40px; border-radius:50%; border:2px solid var(--ink); background:var(--parch); color:var(--ink); font:700 22px/1 var(--font-body); cursor:pointer; padding:0; box-shadow:0 2px 0 #000}
.sk .plus:disabled{opacity:.3; box-shadow:none}
.item{padding:8px 10px; border-radius:7px; background:var(--panel); border:2px solid var(--rc, var(--ink)); display:grid; gap:4px}
.item h4{margin:0; font:400 16px var(--font-display); color:var(--rc, var(--fg))}
.item .meta{font-size:11px; color:var(--muted)}
.item ul{margin:0; padding:0; list-style:none; font-size:12px}
.item .acts{display:flex; gap:6px; margin-top:2px}
.btn.xs{min-height:36px; font-size:13px; padding:6px 10px; flex:1; width:auto}
.h3{margin:4px 0 0; font:400 15px var(--font-display); color:var(--accent)}
@media (orientation:landscape){ .cards{grid-template-columns:repeat(3,1fr)} .card{min-height:92px; align-content:start} .sheet{gap:8px} #screen h2{font-size:24px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

// Конфіг береться з firebase-config.js (window.FIREBASE_CONFIG). Без нього працює тільки локальний рейтинг.
const FIREBASE_CONFIG = window.FIREBASE_CONFIG || {};
const FB_CDN = 'https://www.gstatic.com/firebasejs/10.14.1/';
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
const LB = {
  enabled: !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId),
  _p: null,
  init() {
    if (!this.enabled) return Promise.reject(new Error('off'));
    if (!this._p) this._p = (async () => {
      const mods = await Promise.all([import(FB_CDN + 'firebase-app.js'), import(FB_CDN + 'firebase-auth.js'), import(FB_CDN + 'firebase-firestore.js')]);
      const app = mods[0].initializeApp(FIREBASE_CONFIG), auth = mods[1].getAuth(app);
      const cred = auth.currentUser ? { user:auth.currentUser } : await mods[1].signInAnonymously(auth);
      return { fs:mods[2], db:mods[2].getFirestore(app), uid:cred.user.uid };
    })().catch(err => { this._p = null; throw err; });
    return this._p;
  },
  // Один запис на гравця (id документа = uid). Перезаписується, лише якщо новий результат кращий.
  async submit(run) {
    const c = await withTimeout(this.init(), 12000), fs = c.fs, ref = fs.doc(c.db, 'runs', c.uid);
    const old = await withTimeout(fs.getDoc(ref), 12000);
    if (old.exists() && (old.data().score || 0) >= run.score) return { saved:false, best:old.data().score || 0 };
    await withTimeout(fs.setDoc(ref, Object.assign({}, run, { uid:c.uid, createdAt:fs.serverTimestamp() })), 12000);
    return { saved:true, best:run.score };
  },
  async top(n) {

    const snap = await withTimeout(fs.getDocs(fs.query(fs.collection(c.db, 'runs'), fs.orderBy('score', 'desc'), fs.limit(n))), 12000);
    return snap.docs.map(d => Object.assign({ id:d.id }, d.data()));
  }
};

    ctx.beginPath(); ctx.arc(0, 0, b.r * 0.55, 0, TAU); ctx.fillStyle = '#ff7af4'; ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-0.6, -0.6, b.r * 0.22, 0, TAU); ctx.fill();
    ctx.restore();
  }
  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.6, 0, TAU); ctx.fill(); }
  ctx.globalAlpha = 1;
  drawLight();
  if (G.state === 'tele' && G.tele) drawTele();
  drawFloaters();
  ctx.restore();
  if (J.active) {
    ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.strokeStyle = 'rgba(255,240,210,.4)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(J.ox, J.oy, JR, 0, TAU); ctx.fill(); ctx.stroke();
    const dx = J.x - J.ox, dy = J.y - J.oy, d = Math.hypot(dx, dy) || 1, m = Math.min(d, JR);
    ctx.fillStyle = 'rgba(255,240,210,.4)'; ctx.beginPath(); ctx.arc(J.ox + dx / d * m, J.oy + dy / d * m, 18, 0, TAU); ctx.fill();
  }
}

/* ---------- HUD ---------- */
const cache = {};
function setText(node, key, val) { if (cache[key] !== val) { cache[key] = val; node.textContent = val; } }
function hud() {
  setText(el.wave, 'w', 'Хвиля ' + G.wave);
  setText(el.kills, 'k', 'Рів. ' + P.lvl + ' · ' + G.kills + ' вбито');
  const hp = Math.max(0, Math.ceil(P.hp));
  setText(el.hpText, 'hp', hp + ' / ' + P.maxHp);
  const w = Math.max(0, P.hp / P.maxHp * 100).toFixed(1) + '%';
  if (cache.hpw !== w) { cache.hpw = w; el.hpFill.style.width = w; }
  const low = P.hp / P.maxHp < 0.3;
  if (cache.low !== low) { cache.low = low; el.hp.classList.toggle('low', low); }
  const act = Object.keys(BOOSTS).filter(k => B[k] > 0), bk = act.map(k => k + Math.ceil(B[k])).join(',');
  if (cache.bk !== bk) {
    cache.bk = bk;
    el.boosts.innerHTML = act.map(k => '<span class="chip" style="--c:' + BOOSTS[k].col + '">' + BOOSTS[k].short + ' ' + Math.ceil(B[k]) + '</span>').join('');
  }
  const xw = (P.xp / xpNeed(P.lvl) * 100).toFixed(1) + '%';
  if (cache.xw !== xw) { cache.xw = xw; el.xpFill.style.width = xw; }
  if (cache.sp !== P.sp) { cache.sp = P.sp; el.badge.hidden = P.sp <= 0; el.badge.textContent = P.sp; }
}

/* ---------- loop ---------- */
let last = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  ANIM += dt;
  update(dt); render(); hud();
}
newGame();
if (!lookSaved) { G.state = 'menu'; resetInput(); openLook('first'); } else showMenu();
requestAnimationFrame(frame);
})();
</script>
